<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="852" viewBox="0 0 1240 852" role="img" aria-label="Kien truc he thong tong the chia nam tang: nguoi dung, giao dien ung dung, dieu phoi va giao tiep, xu ly chuyen biet gom nhom cot loi va nhom mo rong, loi AI va nen tang tri thuc">
