  <text x="283" y="200" font-size="10" font-weight="600" fill="#7d8a97" letter-spacing="1" text-anchor="middle">TẦNG 1</text>
  <text x="326" y="201" font-size="16" font-weight="600" fill="#101720">Người dùng</text>
  <text x="252" y="228" font-size="12" fill="#4d5a68">Giáo viên · Học sinh, sinh viên · Cán bộ quản lý giáo dục · Phụ huynh — cùng một giao diện web trên máy tính hoặc điện thoại</text>

