  <text x="44" y="80" font-size="27" font-weight="600" fill="#101720">Kiến trúc hệ thống tổng thể</text>
  <text x="44" y="106" font-size="14" fill="#4d5a68">Năm tầng chồng lên nhau: tầng dưới phục vụ tầng trên, toàn bộ mô hình và chỉ mục nằm trên máy chạy hệ thống</text>
