  <text x="233" y="306" font-size="10" font-weight="600" fill="#2a78d6" letter-spacing="1" text-anchor="middle">TẦNG 2</text>
  <text x="276" y="307" font-size="16" font-weight="600" fill="#101720">Giao diện ứng dụng</text>
  <text x="202" y="334" font-size="12" fill="#4d5a68">Trang tĩnh do chính FastAPI phục vụ — HTML, CSS và JavaScript thuần, không framework, không tải thư viện từ CDN</text>
  <text x="202" y="352" font-size="12" fill="#4d5a68">Khung hỏi đáp phát dần từng chữ · Tải tệp đính kèm · Lịch sử hội thoại · Quản lý tài liệu và đổi mô hình trả lời</text>

  <line x1="620" y1="396" x2="620" y2="374" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ka)"/>

