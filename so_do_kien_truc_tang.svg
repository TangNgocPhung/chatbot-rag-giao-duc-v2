  <text x="152" y="458" font-size="12" fill="#4d5a68">FastAPI với khoảng 25 đầu cuối · Kiểm tra dữ liệu vào bằng Pydantic · Lớp mật khẩu bảo vệ bản chạy công khai</text>
  <text x="152" y="476" font-size="12" fill="#4d5a68">Máy trạng thái starting → loading → ready, chuyển updating khi nạp lại chỉ mục và error khi mất kết nối Ollama</text>

