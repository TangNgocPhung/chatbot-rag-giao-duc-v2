<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-label="Kien truc mo hinh RAG: bge-m3 nhung tai lieu va cau hoi, truy hoi lai FAISS va BM25 hop nhat RRF, xep hang lai, qwen3.5:4b sinh cau tra loi va hau kiem">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8a97"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#eb6834"/></marker>
</defs>
<rect width="1240" height="800" fill="#f4f6f8"/>

<g font-family="'Be Vietnam Pro','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <text x="44" y="42" font-size="11" font-weight="600" fill="#7d8a97" letter-spacing="1.6">CHATBOT RAG GIÁO DỤC · SƠ ĐỒ KIẾN TRÚC</text>
  <text x="44" y="80" font-size="27" font-weight="600" fill="#101720">Kiến trúc mô hình RAG</text>
  <text x="44" y="106" font-size="14" fill="#4d5a68">Một mô hình nhúng và một mô hình ngôn ngữ, nối với nhau bằng truy hồi lai hai chiều và các lớp kiểm soát bằng chứng</text>
  <line x1="44" y1="130" x2="1196" y2="130" stroke="#dfe5ec" stroke-width="1"/>

  <rect x="24" y="150" width="1192" height="176" rx="14" fill="#eaeef3"/>
  <rect x="24" y="346" width="1192" height="434" rx="14" fill="#eaeef3"/>
  <g font-size="11" font-weight="600" fill="#4d5a68" letter-spacing="1.4">
    <text x="44" y="178">A · LẬP CHỈ MỤC</text>
    <text x="44" y="374">B · TRUY VẤN</text>
  </g>

  <!-- ===== A ===== -->
  <rect x="44" y="194" width="204" height="116" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="281" y="194" width="204" height="116" rx="11" fill="#e7f7f1" stroke="#1baf7a" stroke-width="1.4"/>
  <rect x="518" y="194" width="204" height="116" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="755" y="194" width="441" height="116" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <g font-size="13.5" font-weight="600" fill="#101720">
    <text x="60" y="222">Tài liệu → đoạn văn</text>
    <text x="297" y="222">Bộ mã hóa bge-m3</text>
    <text x="534" y="222">Chỉ mục kép</text>
    <text x="771" y="222">Hai mô hình, cùng chạy trên máy qua Ollama</text>
  </g>
  <g font-size="12" fill="#4d5a68">
    <text x="60" y="250">đoạn tối đa 1.200 ký tự</text>
    <text x="60" y="270">chồng lấn 150 ký tự</text>
    <text x="60" y="290">kèm siêu dữ liệu nguồn</text>
    <text x="297" y="250">mô hình nhúng đa ngôn ngữ</text>
    <text x="297" y="270">đoạn → vector 1.024 chiều</text>
    <text x="297" y="290">chạy cục bộ trên CPU</text>
    <text x="534" y="250">FAISS: tìm theo nghĩa</text>
    <text x="534" y="270">BM25: tìm theo từ khóa</text>
    <text x="534" y="290">FAISS ghi ra đĩa</text>
    <text x="771" y="250"><tspan font-weight="600" fill="#138a60">bge-m3</tspan> — mô hình nhúng, dùng cho cả tài liệu lẫn câu hỏi</text>
    <text x="771" y="270"><tspan font-weight="600" fill="#138a60">qwen3.5:4b</tspan> — mô hình ngôn ngữ sinh câu trả lời, đổi được</text>
    <text x="771" y="290">Tài liệu và câu hỏi không gửi ra dịch vụ bên ngoài</text>
  </g>
  <g stroke="#2a78d6" stroke-width="1.6" fill="none" marker-end="url(#ab)">
    <line x1="252" y1="252" x2="276" y2="252"/>
    <line x1="489" y1="252" x2="513" y2="252"/>
  </g>

  <!-- noi A voi B -->
  <g stroke="#7d8a97" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)">
    <line x1="383" y1="312" x2="383" y2="386"/>
    <line x1="620" y1="312" x2="620" y2="386"/>
  </g>
  <g font-size="11" fill="#7d8a97">
    <text x="393" y="362">cùng mô hình</text>
    <text x="630" y="362">đọc chỉ mục</text>
  </g>

  <!-- ===== B hang 1 ===== -->
  <rect x="44" y="444" width="204" height="92" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="281" y="390" width="204" height="92" rx="11" fill="#e7f7f1" stroke="#1baf7a" stroke-width="1.4"/>
  <rect x="281" y="498" width="204" height="92" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="518" y="390" width="204" height="92" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="518" y="498" width="204" height="92" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="755" y="436" width="204" height="108" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="992" y="436" width="204" height="108" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <g font-size="13.5" font-weight="600" fill="#101720">
    <text x="60" y="472">Câu hỏi</text>
    <text x="297" y="418">bge-m3</text>
    <text x="297" y="526">Tách từ khóa</text>
    <text x="534" y="418">FAISS</text>
    <text x="534" y="526">BM25</text>
    <text x="771" y="464">Hợp nhất RRF</text>
    <text x="1008" y="464">Xếp hạng lại</text>
  </g>
  <g font-size="12" fill="#4d5a68">
    <text x="60" y="498">gộp ngữ cảnh hội thoại</text>
    <text x="60" y="518">lọc phạm vi môn / cấp</text>
    <text x="297" y="444">câu hỏi → vector 1.024 chiều</text>
    <text x="297" y="464">đo tương đồng ngữ nghĩa</text>
    <text x="297" y="552">bỏ từ dừng</text>
    <text x="297" y="572">mở rộng từ đồng nghĩa</text>
    <text x="534" y="444">15 đoạn gần nghĩa nhất</text>
    <text x="534" y="464">bắt được cách diễn đạt khác</text>
    <text x="534" y="552">15 đoạn khớp từ khóa nhất</text>
    <text x="534" y="572">bắt số hiệu, tên riêng</text>
    <text x="771" y="492">điểm = Σ 1 / (60 + hạng)</text>
    <text x="771" y="512">hai danh sách → một</text>
    <text x="771" y="532">không cần chuẩn hóa điểm</text>
    <text x="1008" y="492">cộng điểm khớp tiêu đề</text>
    <text x="1008" y="512">trừ điểm hết hiệu lực</text>
    <text x="1008" y="532">tối đa 2 đoạn / tài liệu</text>
  </g>
  <g stroke="#2a78d6" stroke-width="1.6" fill="none" marker-end="url(#ab)">
    <path d="M250,490 H264 V436 H276"/>
    <path d="M264,490 V544 H276"/>
    <line x1="489" y1="436" x2="513" y2="436"/>
    <line x1="489" y1="544" x2="513" y2="544"/>
    <path d="M724,436 H738 V490 H750"/>
    <path d="M724,544 H738 V490"/>
    <line x1="963" y1="490" x2="987" y2="490"/>
    <path d="M1094,546 V608 H146 V628"/>
  </g>
  <text x="857" y="600" font-size="11" fill="#2a78d6" text-anchor="middle">4 đoạn bằng chứng tốt nhất</text>

  <!-- ===== B hang 2 ===== -->
  <rect x="44" y="634" width="204" height="118" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="281" y="634" width="204" height="118" rx="11" fill="#e7f7f1" stroke="#1baf7a" stroke-width="1.4"/>
  <rect x="518" y="634" width="204" height="118" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="755" y="634" width="204" height="118" rx="11" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="992" y="634" width="204" height="118" rx="11" fill="#fdeee7" stroke="#eb6834" stroke-dasharray="5 4"/>
  <g font-size="13.5" font-weight="600" fill="#101720">
    <text x="60" y="662">Ghép prompt</text>
    <text x="297" y="662">qwen3.5:4b</text>
    <text x="534" y="662">Hậu kiểm</text>
    <text x="771" y="662">Câu trả lời</text>
    <text x="1008" y="662" fill="#b8481c">Lối ra sớm</text>
  </g>
  <g font-size="12" fill="#4d5a68">
    <text x="60" y="690">quy tắc chống bịa</text>
    <text x="60" y="710">đoạn trích đánh số [1]…[4]</text>
    <text x="60" y="730">lịch sử hội thoại gần nhất</text>
    <text x="297" y="690">sinh câu trả lời tiếng Việt</text>
    <text x="297" y="710">phát dần từng chữ</text>
    <text x="297" y="730">chỉ dựa trên đoạn trích</text>
    <text x="534" y="690">trích dẫn [n] có hợp lệ?</text>
    <text x="534" y="710">con số có trong đoạn trích?</text>
    <text x="534" y="730">không đạt → báo rõ</text>
    <text x="771" y="690">kèm nguồn và vị trí</text>
    <text x="771" y="710">gợi ý câu hỏi tiếp theo</text>
    <text x="771" y="730">lưu cache ngữ nghĩa</text>
    <text x="1008" y="690">trùng cache (cosine ≥ 0,96)</text>
    <text x="1008" y="710">câu tính toán → Python</text>
    <text x="1008" y="730">lạc đề → từ chối, không đoán</text>
  </g>
  <g stroke="#2a78d6" stroke-width="1.6" fill="none" marker-end="url(#ab)">
    <line x1="252" y1="693" x2="276" y2="693"/>
    <line x1="489" y1="693" x2="513" y2="693"/>
    <line x1="726" y1="693" x2="750" y2="693"/>
  </g>
</g>
</svg>
