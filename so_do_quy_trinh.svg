<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="Sơ đồ quy trình: câu hỏi đi qua rẽ nhanh, truy hồi lai, cổng chặn lạc đề, sinh câu trả lời, hậu kiểm, rồi ra câu trả lời có nguồn">
      <defs>
        <marker id="ten" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d99a5"></path>
        </marker>
      </defs>
<rect x="0" y="0" width="1000" height="570" fill="#ffffff"></rect>
      <!-- ===== Lối tắt ===== -->
      <rect x="250" y="20" width="480" height="104" rx="12" fill="none" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="6 5"></rect>
      <text x="264" y="45" fill="#eb6834" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1.3">LỐI TẮT · THOÁT SỚM</text>

      <rect x="262" y="56" width="148" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"></rect>
      <text x="276" y="80" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="600">Tệp đính kèm</text>
      <text x="276" y="98" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">đọc trong tệp</text>

      <rect x="422" y="56" width="148" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"></rect>
      <text x="436" y="80" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="600">Tính lương</text>
      <text x="436" y="98" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">Python · vài µs</text>

      <rect x="582" y="56" width="148" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"></rect>
      <text x="596" y="80" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="600">Cache ≥ 0,96</text>
      <text x="596" y="98" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">trả lại · 0 giây</text>

      <line x1="370" y1="170" x2="370" y2="130" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>

      <!-- ===== Hàng 1: 01 → 04 ===== -->
      <rect x="30" y="170" width="200" height="88" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"></rect>
      <text x="214" y="190" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">01</text>
      <text x="46" y="198" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Câu hỏi</text>
      <text x="46" y="220" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">POST /api/chat/stream</text>
      <text x="46" y="237" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">+ bộ lọc phạm vi</text>

      <line x1="230" y1="214" x2="266" y2="214" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>

      <rect x="270" y="170" width="200" height="88" rx="14" fill="#eef1f5" stroke="#eb6834" stroke-width="1.6"></rect>
      <text x="454" y="190" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">02</text>
      <text x="370" y="222" text-anchor="middle" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Có đường tắt?</text>

      <line x1="470" y1="214" x2="506" y2="214" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>
      <text x="488" y="205" text-anchor="middle" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">không</text>

      <rect x="510" y="170" width="200" height="88" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"></rect>
      <text x="694" y="190" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">03</text>
      <text x="526" y="198" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Dựng lại truy vấn</text>
      <text x="526" y="220" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">ghép câu hỏi trước</text>
      <text x="526" y="237" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">6 lượt gần nhất</text>

      <line x1="710" y1="214" x2="746" y2="214" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>

      <rect x="750" y="170" width="200" height="88" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"></rect>
      <text x="934" y="190" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">04</text>
      <text x="766" y="198" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Truy hồi lai</text>
      <text x="766" y="220" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">FAISS 15 + BM25 15</text>
      <text x="766" y="237" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">RRF k=60 → 4 khối</text>

      <path d="M 850 258 L 850 332" fill="none" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></path>

      <!-- ===== Hàng 2: 05 → 08, chảy sang trái ===== -->
      <rect x="750" y="338" width="200" height="88" rx="14" fill="#eef1f5" stroke="#cf4438" stroke-width="1.6"></rect>
