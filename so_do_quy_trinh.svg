      <text x="850" y="384" text-anchor="middle" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Có dính tới</text>
      <text x="850" y="404" text-anchor="middle" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">câu hỏi?</text>

      <line x1="750" y1="382" x2="714" y2="382" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>
      <text x="732" y="373" text-anchor="middle" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">có</text>

      <line x1="850" y1="426" x2="850" y2="478" stroke="#8d99a5" stroke-width="1.4" marker-end="url(#ten)"></line>
      <text x="860" y="456" fill="#cf4438" font-family="IBM Plex Mono, monospace" font-size="10">lạc đề</text>
      <rect x="740" y="484" width="230" height="52" rx="9" fill="#ffffff" stroke="#cf4438" stroke-width="1.4"></rect>
      <text x="756" y="506" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="13.5" font-weight="600">Không trả lời</text>
      <text x="756" y="524" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">+ 3 gợi ý thay thế</text>

      <rect x="510" y="338" width="200" height="88" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"></rect>
      <text x="694" y="358" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">06</text>
      <text x="526" y="366" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Soạn câu trả lời</text>
      <text x="526" y="388" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">4 khối · 900 ký tự</text>
      <text x="526" y="405" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">llama3.2:3b</text>

      <line x1="510" y1="382" x2="474" y2="382" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>

      <rect x="270" y="338" width="200" height="88" rx="14" fill="#eef1f5" stroke="#1baf7a" stroke-width="1.6"></rect>
      <text x="454" y="358" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">07</text>
      <text x="370" y="384" text-anchor="middle" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Trích dẫn và</text>
      <text x="370" y="404" text-anchor="middle" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">số liệu khớp?</text>

      <line x1="370" y1="426" x2="370" y2="478" stroke="#8d99a5" stroke-width="1.4" marker-end="url(#ten)"></line>
      <text x="380" y="456" fill="#eb6834" font-family="IBM Plex Mono, monospace" font-size="10">không đạt</text>
      <rect x="260" y="484" width="230" height="52" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.4"></rect>
      <text x="276" y="506" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="13.5" font-weight="600">Gắn cảnh báo</text>
      <text x="276" y="524" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">không ghi vào cache</text>

      <line x1="270" y1="382" x2="234" y2="382" stroke="#8d99a5" stroke-width="1.5" marker-end="url(#ten)"></line>
      <text x="252" y="373" text-anchor="middle" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10">đạt</text>

      <rect x="30" y="338" width="200" height="88" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="2"></rect>
      <text x="214" y="358" text-anchor="end" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">08</text>
      <text x="46" y="366" fill="#101720" font-family="Be Vietnam Pro, sans-serif" font-size="14.5" font-weight="600">Câu trả lời</text>
      <text x="46" y="388" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">4 nguồn trích dẫn</text>
      <text x="46" y="405" fill="#7d8a97" font-family="IBM Plex Mono, monospace" font-size="10.5">cảnh báo hiệu lực</text>
</svg>